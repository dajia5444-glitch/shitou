*{box-sizing:border-box;margin:0;padding:0}

.topbar h1{font-size:18px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn{border:none;border-radius:9px;padding:8px 14px;font-size:13px;cursor:pointer;font-weight:600;transition:.15s;display:inline-flex;align-items:center;gap:5px}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:hover{background:#1e40af}
.btn-ghost{background:#fff;border:1px solid var(--line2);color:var(--ink)}

.btn-danger{background:#fff;border:1px solid #fecaca;color:var(--red)}

.hero h2{font-size:24px;font-weight:800;margin-bottom:6px}

.hero .userrow{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;align-items:center}
.hero input,.hero select{border:none;border-radius:9px;padding:9px 12px;font-size:13px;outline:none;background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.25)}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;cursor:pointer;transition:.18s;box-shadow:var(--shadow);position:relative}

.card .ic{font-size:26px;margin-bottom:8px}
.card h3{font-size:16px;font-weight:700;margin-bottom:4px}
.card .desc{color:var(--mut);font-size:12.5px;margin-bottom:12px;min-height:34px}
.card .bar{height:7px;background:#eef2f7;border-radius:6px;overflow:hidden;margin-bottom:6px}
.card .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand2),var(--brand));border-radius:6px;transition:width .4s}
.card .stat{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
.card .done{color:var(--green);font-weight:700}
.card .pct{font-weight:700;color:var(--brand)}
.toolbar{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow)}
.toolbar h4{font-size:14px;font-weight:700;margin-bottom:10px}
.toolbar .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.tip{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;border-radius:10px;padding:10px 14px;font-size:12.5px;margin-top:10px}
/* ---------- 表单页通用 ---------- */
.formhead{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.formhead .fic{font-size:30px}
.formhead h2{font-size:20px;font-weight:800}
.formhead .fdesc{color:var(--mut);font-size:13px;flex-basis:100%}
.progline{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:14px;box-shadow:var(--shadow);flex-wrap:wrap}

.progline .pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand2),var(--brand));border-radius:6px;transition:width .3s}
.progline .ptxt{font-size:12.5px;color:var(--mut);white-space:nowrap}
.progline .who{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:13px}
.progline .who input{width:110px}
input[type=text],input[type=date],select,textarea{font:inherit;color:inherit;border:1px solid var(--line2);border-radius:8px;padding:6px 9px;background:#fff;outline:none;transition:.15s;max-width:100%}

.simple-item .q{font-weight:600;margin-bottom:10px}
.simple-item .fields{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.tablewrap .tt .tsub{font-weight:400;color:var(--mut);font-size:12px}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th{background:#f1f5f9;text-align:left;font-weight:600;color:#475569;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
table.tbl td{padding:8px 10px;border-bottom:1px solid #eef2f7;vertical-align:top}

table.tbl tr:hover td{background:#f8fafc}
.mod-row td{background:#eef4ff !important;font-weight:700;color:#1e40af;padding:8px 12px;border-bottom:1px solid #dbeafe;border-top:2px solid #dbeafe}
.mod-row:hover td{background:#eef4ff !important}
.sub-row td{background:#f5f7fb !important;color:#475569;padding:6px 12px}

.w-1{width:44px;text-align:center;color:var(--mut)}
.w-item{min-width:200px;max-width:340px}
.w-std{min-width:240px;max-width:420px}
.w-prio{width:56px;text-align:center}
.w-owner{width:110px}
.w-method{width:130px;color:var(--mut);font-size:12px}
.w-status{width:118px}
.w-note{min-width:120px;max-width:200px}
.w-checker{width:100px}
td .stdtext{color:var(--mut);font-size:12px;line-height:1.55;cursor:pointer}
td .stdtext.collapsed{max-height:2.9em;overflow:hidden;position:relative}
td .stdtext.collapsed:after{content:"⋯";position:absolute;right:0;bottom:0;background:linear-gradient(90deg,transparent,#fff 60%)}

.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:#0f172a;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.25)}

.modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px}

.modal .mrow{display:flex;gap:8px;justify-content:flex-end}
.meta-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;padding:14px 16px;background:#fff}
.meta-grid .f label{display:block;font-size:11.5px;color:var(--mut);margin-bottom:3px}
.meta-grid .f input{width:100%}
.section-title{font-size:15px;font-weight:800;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.section-title .cnt{font-size:12px;color:var(--mut);font-weight:400}
.empty{color:var(--mut);text-align:center;padding:40px 0;font-size:13px}
@media (max-width:720px){
  .topbar h1{font-size:16px}
  .grid{grid-template-columns:1fr}
  .w-item,.w-std{min-width:140px;max-width:200px}
}
</style>

/* ---------- state ---------- */
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function defaultState(){
  const webSites = SHEETS.web.sites.map(name => ({
    name, date:'', time:'', owner:'',
    rows: SHEETS.web.groups.reduce((a,g)=>a.concat(g.items), []).map(()=>({status:'',note:'',remark:''}))
  }));
  return { userName:'', savedAt:'', forms: {
    quick: { items: clone(SHEETS.quick.items) },
    gray:  { groups: clone(SHEETS.gray.groups) },
    gp:    { meta: clone(SHEETS.gp.meta), meta2: clone(SHEETS.gp.meta2), modules: clone(SHEETS.gp.modules) },
    ios:   { meta: clone(SHEETS.ios.meta), meta2: clone(SHEETS.ios.meta2), modules: clone(SHEETS.ios.modules) },
    sdk:   { rows: clone(SHEETS.sdk.rows) },
    acct:  { rows: clone(SHEETS.acct.rows) },
    web:   { sites: webSites },
  }};
}
let S = null;
try{ S = JSON.parse(localStorage.getItem(LS_KEY)); }catch(e){ S = null; }
if (!S || !S.forms) { S = defaultState(); }
else { // 兼容旧版本：补齐缺失的表单结构
  const d = defaultState();
  Object.keys(d.forms).forEach(k => { if (!S.forms[k]) S.forms[k] = d.forms[k]; });
  if (!S.userName) S.userName = '';
}

/* ---------- 进度 ---------- */
function fTotal(id){
  const f = S.forms[id];
  if (id === 'quick') return f.items.length;
  if (id === 'gray') return f.groups.reduce((a,g)=>a+g.items.length,0);
  if (id === 'gp' || id === 'ios') return f.modules.reduce((a,m)=>a+m.rows.length,0);
  if (id === 'sdk') return f.rows.length;
  if (id === 'acct') return f.rows.length;
  if (id === 'web') return f.sites.length * SHEETS.web.groups.reduce((a,g)=>a+g.items.length,0);
  return 0;
}
function fDone(id){
  const f = S.forms[id];
  if (id === 'quick') return f.items.filter(i=>i.status).length;
  if (id === 'gray') return f.groups.reduce((a,g)=>a+g.items.filter(i=>i.status).length,0);
  if (id === 'gp' || id === 'ios') return f.modules.reduce((a,m)=>a+m.rows.filter(r=>r.status).length,0);
  if (id === 'sdk') return f.rows.filter(r=>r.cells[1] && r.cells[1].trim()).length;
  if (id === 'acct') return f.rows.filter(r=>r.cells[3] && r.cells[3].trim()).length;
  if (id === 'web') return f.sites.reduce((a,s)=>a+s.rows.filter(r=>r.status).length,0);
  return 0;
}
function prog(id){ const t=fTotal(id), dn=fDone(id); return {t, dn, pct: t? Math.round(dn/t*100):0}; }

/* ---------- 保存 ---------- */
let saveTimer = null;
function save(now){
  S.savedAt = new Date().toLocaleString('zh-CN',{hour12:false});
  localStorage.setItem(LS_KEY, JSON.stringify(S));
  const el = $('#savedtip');
  if (el) el.textContent = '已保存 ' + S.savedAt;
  if (now) toast('已保存 ✔');
}
function saveSoon(){ clearTimeout(saveTimer); saveTimer = setTimeout(()=>save(false), 600); }

/* ---------- 路径写入 ---------- */
function setByKey(key, val){
  const parts = key.split('.');
  let o = S;
  for (let i=0;i<parts.length-1;i++){ o = o[parts[i]]; if (o==null) return; }
  o[parts[parts.length-1]] = val;
  saveSoon();
}
function getByKey(key){
  const parts = key.split('.');
  let o = S;
  for (const p of parts){ o = o[p]; if (o==null) return ''; }
  return o;
}

document.addEventListener('input', e => {
  const el = e.target, key = el.dataset && el.dataset.key;
  if (!key) return;
  if (el.dataset && el.dataset.sync === 'user') {
    // 全局填写人：同步各表单负责人/检查人(空位)
    S.userName = el.value;
    fillOwners(S.userName);
    saveSoon();
    return;
  }
  setByKey(key, el.value);
});
document.addEventListener('change', e => {
  const el = e.target, key = el.dataset && el.dataset.key;
  if (!key) return;
  setByKey(key, el.value);
  if (el.dataset && el.dataset.sync === 'user') { S.userName = el.value; fillOwners(el.value); }
  saveSoon();
  refreshProgress(el.dataset && el.dataset.form);
});
function fillOwners(name){
  if (!name) return;
  ['gp','ios'].forEach(id => {
    S.forms[id].modules.forEach(m => m.rows.forEach(r => { if (!r.owner) r.owner = name; }));
  });
  S.forms.gray.groups.forEach(g => g.items.forEach(i => { if (!i.checker) i.checker = name; }));
  S.forms.web.sites.forEach(s => { if (!s.owner) s.owner = name; });
}
function refreshProgress(formId){

}

/* ---------- 编辑表格增删行 ---------- */
function addEditRow(id){
  const f = S.forms[id];
  const cells = [''] .concat(Array(Math.max(0, f.rows[0]?f.rows[0].cells.length-1 : 0)).fill(''));
  const no = f.rows.length + 1;
  cells[0] = String(no);
  f.rows.push({cells});
  save(true); renderForm(id);
}
function delEditRow(id, idx){
  if (S.forms[id].rows.length <= 1){ toast('至少保留一行'); return; }
  S.forms[id].rows.splice(idx,1);
  S.forms[id].rows.forEach((r,i)=> r.cells[0] = String(i+1));
  save(true); renderForm(id);
}

/* ---------- Web 站点管理 ---------- */
function switchWebSite(i){ curWebSite = i; renderForm('web'); }
function addWebSite(){
  const name = prompt('输入新站点名称（如：新站点A）');
  if (!name || !name.trim()) return;
  const rows = SHEETS.web.groups.reduce((a,g)=>a.concat(g.items), []).map(()=>({status:'',note:'',remark:''}));
  S.forms.web.sites.push({name: name.trim(), date:'', time:'', owner: S.userName || '', rows});
  curWebSite = S.forms.web.sites.length - 1;
  save(true); renderForm('web');
}
function delWebSite(){
  const sites = S.forms.web.sites;
  if (sites.length <= 1){ toast('至少保留一个站点'); return; }
  if (!confirm('确定删除站点「' + sites[curWebSite].name + '」及其全部巡检记录？')) return;
  sites.splice(curWebSite, 1);
  if (curWebSite >= sites.length) curWebSite = sites.length - 1;
  save(true); renderForm('web');
}

/* ---------- 导出 ---------- */
function fmtStatus(v){ return v ? v : '未选择'; }

function textOf(id){
  const sh = SHEETS[id], f = S.forms[id];
  const lines = ['【' + sh.name + '】', '填写人：' + (S.userName||'未填写') + '　导出时间：' + new Date().toLocaleString('zh-CN',{hour12:false})];
  if (sh.type === 'simple'){
    f.items.forEach((it,i)=>{ lines.push((i+1)+'. ' + it.text + '　→ 状态：' + fmtStatus(it.status) + (it.note ? '　备注：' + it.note : '')); });
  }
  if (sh.type === 'gray'){
    f.groups.forEach(g=>{
      lines.push('');
      lines.push('■ ' + g.name);
      g.items.forEach((it,i)=>{ lines.push('  ' + (i+1) + '. ' + it.text + '　| 检查人：' + (it.checker||'—') + '　| 结论：' + fmtStatus(it.status)); });
    });
  }
  if (sh.type === 'big'){
    const m1 = f.meta.map(m=>m[0]+'：'+(m[1]||'')).join('　');
    const m2 = f.meta2.map(m=>m[0]+'：'+(m[1]||'')).join('　');
    lines.push(m1); lines.push(m2);
    f.modules.forEach(m=>{
      lines.push('');
      lines.push('■ ' + m.name);
      m.rows.forEach(r=>{
        lines.push('  ' + (r.no||'') + '. ' + r.item + '　→ 状态：' + fmtStatus(r.status) + (r.owner?'　责任人：'+r.owner:'') + (r.note?'　备注：'+r.note:''));
      });
    });
  }
  if (sh.type === 'edit'){
    lines.push('');
    lines.push(sh.heads.join(' | '));
    f.rows.forEach(r=>{ lines.push(r.cells.map(c=>c||'').join(' | ')); });
  }
  if (sh.type === 'web'){
    const sites = f.sites;
    if (!sites.length) return lines.join('\n');
    if (curWebSite >= sites.length) curWebSite = 0;
    const site = sites[curWebSite];
    lines.push('站点：' + site.name + '　检查日期：' + (site.date||'') + '　检查时间：' + (site.time||'') + '　执行人：' + (site.owner||''));
    let base = 0;
    sh.groups.forEach((g)=>{
      lines.push('');
      lines.push('■ ' + g.name);
      g.items.forEach((it,ii)=>{
        const idx = base + ii;
        const r = site.rows[idx] || {};
        lines.push('  ' + (idx+1) + '. ' + it.item + '　→ 状态：' + (r.status||'未选择') + (r.note?'　说明：'+r.note:'') + (r.remark?'　备注：'+r.remark:''));
      });
      base += g.items.length;
    });
  }
  return lines.join('\n');
}

  const parts = ['【' + sh.name + '】全部站点导出', '填写人：' + (S.userName||'未填写') + '　导出时间：' + new Date().toLocaleString('zh-CN',{hour12:false})];
  const cur = curWebSite;
  S.forms.web.sites.forEach((site,si)=>{
    parts.push(''); parts.push('════ ' + site.name + ' ════');
    parts.push('检查日期：' + (site.date||'') + '　检查时间：' + (site.time||'') + '　执行人：' + (site.owner||''));
    let base = 0;
    sh.groups.forEach((g)=>{
      parts.push('');
      parts.push('■ ' + g.name);
      g.items.forEach((it,ii)=>{
        const idx = base + ii;
        const r = site.rows[idx] || {};
        parts.push('  ' + (idx+1) + '. ' + it.item + '　→ 状态：' + (r.status||'未选择') + (r.note?'　说明：'+r.note:'') + (r.remark?'　备注：'+r.remark:''));
      });
      base += g.items.length;
    });
  });
  curWebSite = cur;
  return parts.join('\n');
}

function download(name, content, mime){
  const blob = new Blob([content], {type: mime || 'text/plain;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 400);
}
function exportForm(id){
  const txt = textOf(id);
  download('上线检查单0806_' + SHEETS[id].name + '.txt', '\ufeff' + txt);
  toast('已导出：' + SHEETS[id].name);
}
function exportAll(){
  const parts = ['上线检查单 0806 —— 汇总导出', '导出时间：' + new Date().toLocaleString('zh-CN',{hour12:false})];
  Object.keys(SHEETS).forEach(id => { parts.push(''); parts.push((id === 'web') ? textOfWebAll() : textOf(id)); });
  download('上线检查单0806_汇总.txt', '\ufeff' + parts.join('\n'));
  toast('已导出汇总文本');
}
function exportAllJSON(){
  download('上线检查单0806_' + new Date().toISOString().slice(0,10) + '.json', JSON.stringify(S, null, 2), 'application/json;charset=utf-8');
  toast('已导出 JSON 数据');
}

/* ---------- 导入合并 ---------- */
function openImport(){
  const mask = document.createElement('div');
  mask.className = 'modal-mask';
  mask.innerHTML = '<div class="modal">' +
    '<h3>导入并合并数据</h3>' +
    '<p style="font-size:12.5px;color:var(--mut);margin-bottom:8px">粘贴之前导出的 JSON（或他人发来的 JSON）。合并规则：对方已填的内容优先，你本机已填但对方为空的保留；不会清空已有数据。</p>' +
    '<textarea id="impjson" placeholder=\'{"userName":"...","forms":{...}}\'></textarea>' +
    '<div class="mrow">' +
      '<button class="btn btn-ghost" onclick="this.closest(\'.modal-mask\').remove()">取消</button>' +
      '<button class="btn btn-primary" id="impbtn">导入并合并</button>' +
    '</div></div>';
  document.body.appendChild(mask);
  $('#impbtn').onclick = () => {
    const raw = $('#impjson').value.trim();
    try{
      const data = JSON.parse(raw);
      if (!data.forms) throw new Error('格式不对');
      S = mergeState(S, data);
      save(true);
      mask.remove();
      renderHome();
      toast('导入合并完成 ✔');
    }catch(err){
      toast('导入失败：' + err.message);
    }
  };
}
function mergeState(base, inc){
  const out = clone(base);
  if (inc.userName && !out.userName) out.userName = inc.userName;
  Object.keys(SHEETS).forEach(id => {
    const fi = inc.forms && inc.forms[id];
    if (!fi) return;
    if (id === 'quick' && fi.items){
      for (let i=0;i<fi.items.length;i++){
        const src = fi.items[i], dst = out.forms.quick.items[i];
        if (!dst) { out.forms.quick.items.push(clone(src)); continue; }
        if (src.status) dst.status = src.status;
        if (src.note) dst.note = src.note;
      }
    }
    if (id === 'gray' && fi.groups){
      out.forms.gray.groups.forEach((g,gi)=>{
        const ig = fi.groups[gi]; if (!ig) return;
        g.items.forEach((it,ii)=>{
          const is = ig.items[ii]; if (!is) return;
          if (is.status) it.status = is.status;
          if (is.checker) it.checker = is.checker;
        });
      });
    }
    if ((id === 'gp' || id === 'ios') && fi.modules){
      const f = out.forms[id];
      if (fi.meta) f.meta = f.meta.map((m,i)=>(fi.meta[i] && fi.meta[i][1]) ? [m[0], fi.meta[i][1]] : m);
      if (fi.meta2) f.meta2 = f.meta2.map((m,i)=>(fi.meta2[i] && fi.meta2[i][1]) ? [m[0], fi.meta2[i][1]] : m);
      f.modules.forEach((m,mi)=>{
        const im = fi.modules[mi]; if (!im) return;
        m.rows.forEach((r,ri)=>{
          const ir = im.rows[ri]; if (!ir) return;
          if (ir.status) r.status = ir.status;
          if (ir.owner) r.owner = ir.owner;
          if (ir.note) r.note = ir.note;
        });
      });
    }
    if ((id === 'sdk' || id === 'acct') && fi.rows){
      const f = out.forms[id];
      fi.rows.forEach((ir,ri)=>{
        if (!f.rows[ri]){ f.rows.push(clone(ir)); return; }
        ir.cells.forEach((c,ci)=>{ if (c) f.rows[ri].cells[ci] = c; });
      });
    }
    if (id === 'web' && fi.sites){
      const itemCount = SHEETS.web.groups.reduce((a,g)=>a+g.items.length,0);
      const f = out.forms[id];
      fi.sites.forEach(is=>{
        let dst = f.sites.find(s=>s.name === is.name);
        if (!dst){
          dst = {name: is.name, date:'', time:'', owner:'', rows: Array(itemCount).fill(0).map(()=>({status:'',note:'',remark:''}))};
          f.sites.push(dst);
        }
        if (is.date) dst.date = is.date;
        if (is.time) dst.time = is.time;
        if (is.owner) dst.owner = is.owner;
        (is.rows||[]).forEach((ir,i)=>{
          const drow = dst.rows[i]; if (!drow || !ir) return;
          if (ir.status) drow.status = ir.status;
          if (ir.note) drow.note = ir.note;
          if (ir.remark) drow.remark = ir.remark;
        });
      });
    }
  });
  return out;
}

/* ---------- 清空 ---------- */
function clearForm(id){
  if (!confirm('确定清空【' + SHEETS[id].name + '】的全部填写内容？此操作不可撤销。')) return;
  S.forms[id] = defaultState().forms[id];
  save(true); renderForm(id);
}
function clearAll(){
  if (!confirm('⚠️ 确定清空全部 7 个表单的填写内容？请先导出备份！此操作不可撤销。')) return;
  S = defaultState();
  save(true); renderHome();
}

/* ---------- toast ---------- */
let toastTimer = null;
function toast(msg){
  const t = $('#toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ---------- 路由 ---------- */
function route(){
  const h = location.hash.replace(/^#\/?/, '');
  if (h && SHEETS[h]) renderForm(h);
  else renderHome();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', route);
route();
</script>
